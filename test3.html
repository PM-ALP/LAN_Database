<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: inherit;
    }
    body {
      padding: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: transparent;
      color: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 8px;
      outline: none;
    }
    .row {
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Cerca una misura..." />
  <label style="display:block; font-size:12px; margin-top:4px;">
  <input type="checkbox" id="deepSearch"> Cerca anche nel contenuto della misura
</label>
   <script>
    let allRows = [];

    function normalize(value) {
      return String(value ?? "").toLowerCase();
    }

    function applyFilter() {
      const query = normalize(document.getElementById("search").value.trim());

      if (!query) {
        // ricerca vuota: non filtriamo la tabella collegata, le mostriamo tutte.
        grist.setSelectedRows(allRows.map(row => row.id));
        return;
      }

       const deep = document.getElementById("deepSearch").checked;
  
        function fullText(row) {
          const lists = ["Approach", "Effect", "Activity"]
            .map(col => Array.isArray(row[col]) ? row[col].filter(v => v !== "L").join(" ") : "");
          return [
            row.Measure, row.Short_description, row.Potential_limits,
            row.Climate_change, row.Examples, ...lists
          ].join(" ");
        }
        
        const filtered = allRows.filter(row =>
          normalize(row.Measure).includes(query) ||
          (deep && normalize(fullText(row)).includes(query))
        );

      // Diciamo a Grist "queste sono le righe da mostrare nel widget
      // collegato tramite Select By". Il widget stesso non mostra più
      // nessun elenco: il filtro si vede solo nella tabella collegata.
      grist.setSelectedRows(filtered.map(row => row.id));
    }

    document.getElementById("search").addEventListener("input", applyFilter);
    document.getElementById("deepSearch").addEventListener("change", applyFilter);

    // allowSelectBy: true -> rende questo widget selezionabile come
    // "Select By" da altri widget della pagina (es. la tua tabella Overview).
    grist.ready({ requiredAccess: "read table", allowSelectBy: true });

    grist.onRecords((records) => {
      allRows = records || [];
      applyFilter();
    });
  </script>
  </body>
</html>
