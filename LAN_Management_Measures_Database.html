<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitor Management Measures</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
 
  /* ---------- TITLE ---------- */
  header {
    background: #2F5233;
    color: #fff;
    padding: 12px 20px;
    font-size: 20px;
    font-weight: bold;
    flex: none; /* fixed height, never grows/shrinks */
  }
 
  /* ---------- GRIST DASHBOARD (fills all remaining space) ---------- */
  iframe {
    flex: 1; /* takes up all the height left over between header and footer */
    width: 100%;
    border: none;
    display: block;
  }
 
  /* ---------- LOGO / ACKNOWLEDGEMENT FOOTER ---------- */
  footer {
    flex: none;
    padding: 8px 20px;
    text-align: center;
    background: #f5f5f5;
    border-top: 1px solid #ddd;
  }
  footer img {
    max-height: 60px;
  }
</style>
</head>
<body>
 
<header>Visitor Management Measures</header>

<iframe src="https://grist.numerique.gouv.fr/o/docs/oT2ip83BcyR5/LiveAlpsNature-or-Visitor-Management-Measure-Database?embed=true"></iframe>

<footer>
  <img src="https://githubusercontent.com/PM-ALP/LAN_Database/refs/heads/main/gist_widget_search_LAN.html" alt="Project acknowledgement">
</footer>
 
</body>
</html>
