<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Measure Search</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>

<body>

  <div>
    <input
      id="search"
      type="search"
      placeholder="Search measures..."
      autocomplete="off"
    >

    <label style="margin-left: 10px;">
      <input
        id="searchContent"
        type="checkbox"
      >
      Search also in measure content
    </label>
  </div>


<script>

  /*
   * This widget acts as a FILTER SOURCE.
   *
   * It does not display search results.
   * It sends the IDs of matching rows to linked widgets.
   */

  grist.ready({
    requiredAccess: "read table",
    allowSelectBy: true
  });


  let records = [];


  /*
   * Convert any Grist value to searchable text.
   */
  function normalize(value) {

    if (value === null || value === undefined) {
      return "";
    }

    if (Array.isArray(value)) {
      return value.join(" ");
    }

    if (typeof value === "object") {
      try {
        return JSON.stringify(value);
      } catch (e) {
        return String(value);
      }
    }

    return String(value);
  }


  /*
   * Case-insensitive and accent-insensitive search.
   *
   * Example:
   * "écologie" -> "ecologie"
   */
  function normalizeForSearch(value) {

    return normalize(value)
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }


  /*
   * Search the records and send matching row IDs
   * to linked widgets.
   */
  async function applySearch() {

    const input =
      document.getElementById("search");

    const searchContent =
      document.getElementById("searchContent").checked;

    const query =
      normalizeForSearch(input.value).trim();


    /*
     * Empty search:
     * show all rows again.
     */
    if (!query) {

      await grist.setSelectedRows(null);

      return;
    }


    /*
     * Split the query into words.
     *
     * Example:
     *
     * "parking alpine"
     *
     * requires both words to be present.
     */
    const terms =
      query
        .split(/\s+/)
        .filter(Boolean);


    const matchingRows = records.filter(record => {

      let searchableText;


      /*
       * Normal mode:
       * search ONLY in $Measure.
       */
      if (!searchContent) {

        searchableText =
          normalizeForSearch(record.Measure);

      }


      /*
       * Extended mode:
       * search in ALL fields of the measure.
       */
      else {

        searchableText =
          Object.values(record)
            .map(value => normalizeForSearch(value))
            .join(" ");
      }


      /*
       * All search words must be present.
       */
      return terms.every(term =>
        searchableText.includes(term)
      );

    });


    /*
     * Get Grist row IDs.
     */
    const rowIds =
      matchingRows
        .map(record => record.id)
        .filter(id =>
          typeof id === "number"
        );


    /*
     * Tell Grist which rows should be selected
     * in linked widgets.
     */
    await grist.setSelectedRows(rowIds);
  }


  /*
   * Receive the complete table from Grist.
   *
   * Important:
   * use rows format explicitly.
   */
  grist.onRecords(
    function(data) {

      records = Array.isArray(data)
        ? data
        : [];

      /*
       * Re-apply the current search when the
       * underlying data changes.
       */
      applySearch();
    },
    {
      format: "rows"
    }
  );


  /*
   * Search while typing.
   */
  document
    .getElementById("search")
    .addEventListener(
      "input",
      applySearch
    );


  /*
   * Re-run the search when the checkbox changes.
   */
  document
    .getElementById("searchContent")
    .addEventListener(
      "change",
      applySearch
    );


</script>

</body>
</html>
