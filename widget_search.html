<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Measure Search</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<input id="search" type="text" placeholder="Search measures…">
<input type="checkbox" id="deepSearch">
<label for="deepSearch">Search also in measure content</label>

<div id="count"></div>
<div id="list"></div>

<script>
// =========================================================================
// 1) CONNECT TO GRIST
// =========================================================================
// allowSelectBy: true -> this widget can be chosen as "Select By" source
// for other widgets on the page (e.g. your existing detail Card).
grist.ready({
  requiredAccess: 'read table',
  allowSelectBy: true
});

const TABLE_NAME = 'VISITOR MANAGEMENT MEASURES'; // <-- change here if your table has another name

let allRecords = [];
let selectedId = null;

// -------------------------------------------------------------------------
// 2) DECODE HELPER (Choice List cells come as ["L", "val1", "val2", ...])
// -------------------------------------------------------------------------
function decodeList(value) {
  if (Array.isArray(value) && value[0] === 'L') return value.slice(1);
  if (Array.isArray(value)) return value;
  return [];
}

// -------------------------------------------------------------------------
// 3) LOAD DATA
// -------------------------------------------------------------------------
async function loadData() {
  const table = await grist.docApi.fetchTable(TABLE_NAME);
  const n = table.id.length;
  const rows = [];
  for (let i = 0; i < n; i++) {
    rows.push({
      id: table.id[i],
      name: table.Measure ? (table.Measure[i] || '') : '',
      description: table.Short_description ? table.Short_description[i] : '',
      issues: table.Potential_limits ? table.Potential_limits[i] : '',
      climate: table.Climate_change ? table.Climate_change[i] : '',
      examples: table.Examples ? table.Examples[i] : '',
      approach: decodeList(table.Approach ? table.Approach[i] : []),
      effect: decodeList(table.Effect ? table.Effect[i] : []),
      activity: decodeList(table.Activity ? table.Activity[i] : []),
    });
  }
  allRecords = rows.filter(r => r.name);
  render();
}

// -------------------------------------------------------------------------
// 4) FULL-TEXT BLOB PER RECORD (used only when the checkbox is checked)
// -------------------------------------------------------------------------
function fullText(r) {
  return [
    r.name, r.description, r.issues, r.climate, r.examples,
    ...r.approach, ...r.effect, ...r.activity,
  ].join(' ').toLowerCase();
}

// -------------------------------------------------------------------------
// 5) FILTER LOGIC
// -------------------------------------------------------------------------
function getFilteredRecords() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const deep = document.getElementById('deepSearch').checked;
  if (!q) return allRecords;
  return allRecords.filter(r =>
    r.name.toLowerCase().includes(q) || (deep && fullText(r).includes(q))
  );
}

// -------------------------------------------------------------------------
// 6) RENDER THE LIST (plain, unstyled)
// -------------------------------------------------------------------------
function render() {
  const results = getFilteredRecords();
  document.getElementById('count').textContent =
    results.length + ' of ' + allRecords.length + ' measures';

  const list = document.getElementById('list');
  list.innerHTML = '';
  results.forEach(r => {
    const item = document.createElement('div');
    item.textContent = r.name + (r.id === selectedId ? '  ✓' : '');
    item.style.cursor = 'pointer';
    item.addEventListener('click', () => {
      selectedId = r.id;
      // Move Grist's cursor to this row -> updates any linked widget
      grist.setCursorPos({ rowId: r.id });
      render();
    });
    list.appendChild(item);
  });
}

// -------------------------------------------------------------------------
// 7) WIRE UP + LOAD
// -------------------------------------------------------------------------
document.getElementById('search').addEventListener('input', render);
document.getElementById('deepSearch').addEventListener('change', render);

loadData();
grist.onRecords(() => loadData());
</script>
</body>
</html>
