<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font-family: Arial, sans-serif;
  }

  body {
    padding: 8px;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    color: inherit;
    background: transparent;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 8px;
    outline: none;
  }

  label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0;
    font-family: Arial, sans-serif;
    color: inherit;
  }

  #results {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    color: inherit;
  }

  .row {
    padding: 4px 0;
    font-family: Arial, sans-serif;
    color: inherit;
  }
</style>
</head>
<body>
  <input id="search" type="text" placeholder="Search measure..." />
  <label>
    <input id="searchAll" type="checkbox" />
    Search in full information
  </label>
  <div id="results"></div>
  
  <script>
    const TABLE_ID = "Overview";
    const MAIN_COLUMN_ID = "Measures";

    let allRows = [];

    function normalize(value) {
      return String(value ?? "").toLowerCase();
    }

    function rowMatches(row, query, searchAll) {
      if (!query) return true;

      const mainValue = normalize(row[MAIN_COLUMN_ID]);
      if (mainValue.includes(query)) return true;

      if (searchAll) {
        return Object.entries(row).some(([key, value]) => {
          if (key === "id") return false;
          return normalize(value).includes(query);
        });
      }

      return false;
    }

    function render(rows) {
      const results = document.getElementById("results");
      results.innerHTML = "";

      rows.forEach(row => {
        const div = document.createElement("div");
        div.textContent = row[MAIN_COLUMN_ID] ?? "";
        results.appendChild(div);
      });
    }

    function applyFilter() {
      const query = normalize(document.getElementById("search").value.trim());
      const searchAll = document.getElementById("searchAll").checked;
      const filtered = allRows.filter(row => rowMatches(row, query, searchAll));
      render(filtered);
    }

    async function loadData() {
      const table = await grist.docApi.fetchTable(TABLE_ID);
      allRows = table;
      applyFilter();
    }

    document.getElementById("search").addEventListener("input", applyFilter);
    document.getElementById("searchAll").addEventListener("change", applyFilter);

    grist.ready({
      access: "read table"
    });

    grist.onRecords(loadData);
    loadData();
  </script>
  </body>
</html>
