<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    html, body, input, label, div, span, button {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
      font-size: 13px !important;
    }
    body {
      padding: 8px;
    }
    #search {
      width: 100%;
      margin-bottom: 10px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
      font-size: inherit !important;
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px 8px;
      outline: none;
      
    }
    
    .deep-search {
      display: flex;
      align-items: center;
      margin-top: 4px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    
    .deep-search input[type="checkbox"] {
      width: auto;
      margin: 0 5px 0 0;
      padding: 0;
    }
      
    }
  </style>
</head>
<body>
    <input id="search" type="text" placeholder="Start typing…">
    <input type="checkbox" id="deepSearch">
    <label for="deepSearch">Search also in all measure information</label>
</label>
</label>
   <script>
    let allRows = [];

    function normalize(value) {
      return String(value ?? "").toLowerCase();
    }

    function applyFilter() {
      const query = normalize(document.getElementById("search").value.trim());

      if (!query) {
        
        grist.setSelectedRows(allRows.map(row => row.id));
        return;
      }

       const deep = document.getElementById("deepSearch").checked;
  
        function fullText(row) {
          const lists = ["Approach", "Effect", "Activity"]
            .map(col => Array.isArray(row[col]) ? row[col].filter(v => v !== "L").join(" ") : "");
          return [
            row.Measure, row.Description, row.Limits,
            row.Climate, row.Examples, ...lists
          ].join(" ");
        }
        
        const filtered = allRows.filter(row =>
          normalize(row.Measure).includes(query) ||
          (deep && normalize(fullText(row)).includes(query))
        );


      grist.setSelectedRows(filtered.map(row => row.id));
    }

    document.getElementById("search").addEventListener("input", applyFilter);
    document.getElementById("deepSearch").addEventListener("change", applyFilter);

    grist.ready({ requiredAccess: "read table", allowSelectBy: true });

    grist.onRecords((records) => {
      allRows = records || [];
      applyFilter();
    });
  </script>
  </body>
</html>
